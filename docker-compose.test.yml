version: '3.9'

services:
  db-test:
    image: postgres:15-alpine
    container_name: premium-share-db-test
    environment:
      POSTGRES_DB: premiumshare_test
      POSTGRES_USER: psuser
      POSTGRES_PASSWORD: pspassword
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U psuser -d premiumshare_test']
      interval: 5s
      timeout: 3s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data
