<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mock Family Admin (DEMO ONLY)</title>
  <style>
    :root {
      --bg: #f6f3ee;
      --ink: #1c1917;
      --accent: #0f766e;
      --warn: #b45309;
      --danger: #b91c1c;
      --card: #fffdf8;
      --line: #d6d3d1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      background: radial-gradient(circle at top left, #e7f5f2, var(--bg) 45%);
      color: var(--ink);
      min-height: 100vh;
      padding: 24px;
    }
    h1 { margin: 0 0 8px; font-size: 1.6rem; }
    .banner {
      background: #fef3c7;
      border: 1px solid #f59e0b;
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 20px;
      font-size: 0.9rem;
    }
    .panel {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 20px;
      max-width: 820px;
      box-shadow: 0 8px 24px rgba(28, 25, 23, 0.06);
    }
    label { display: block; font-size: 0.85rem; margin: 12px 0 4px; }
    input[type="text"], input[type="email"], input[type="number"] {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 0.95rem;
    }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 14px; }
    button {
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      cursor: pointer;
      background: var(--accent);
      color: white;
      font-weight: 600;
    }
    button.secondary { background: #44403c; }
    button.danger { background: var(--danger); }
    button.warn { background: var(--warn); }
    table { width: 100%; border-collapse: collapse; margin-top: 16px; }
    th, td { border-bottom: 1px solid var(--line); padding: 8px; text-align: left; font-size: 0.9rem; }
    [role="alert"] {
      margin-top: 12px;
      padding: 10px;
      background: #fee2e2;
      color: var(--danger);
      border-radius: 6px;
      display: none;
    }
    [role="status"] {
      margin-top: 12px;
      padding: 8px 10px;
      background: #ccfbf1;
      color: #115e59;
      border-radius: 6px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="banner">
    DEMO ONLY — 실제 Google/YouTube 가족이 아닙니다. Playwright role/label 테스트용 모의 화면.
  </div>

  <div class="panel">
    <h1>Mock Family Admin</h1>
    <p>그룹 생성·연결, 멤버/초대, 수락 시뮬, 제거</p>

    <label for="group-key">그룹 키 (external group key)</label>
    <input id="group-key" type="text" aria-label="그룹 키" value="" placeholder="비어 있으면 미연결" />

    <label for="capacity">정원 (capacity)</label>
    <input id="capacity" type="number" aria-label="정원" value="6" min="1" max="20" />

    <div class="row">
      <button type="button" id="btn-create" aria-label="그룹 생성">그룹 생성</button>
      <button type="button" id="btn-link" class="secondary" aria-label="그룹 연결">그룹 연결</button>
      <button type="button" id="btn-paywall" class="warn" aria-label="결제 필요 시나리오">결제 필요 시나리오</button>
      <button type="button" id="btn-clear-paywall" class="secondary" aria-label="결제 해제">결제 해제</button>
    </div>

    <div id="linked-status" role="status" aria-label="그룹 연결됨">그룹 연결됨</div>
    <div id="paywall-alert" role="alert" aria-label="결제 필요">결제 필요 — 유료 가입/결제 화면 (자동화 중단 대상)</div>

    <label for="invite-email">초대 이메일 (invite email)</label>
    <input id="invite-email" type="email" aria-label="초대 이메일" placeholder="member@example.com" />
    <div class="row">
      <button type="button" id="btn-invite" aria-label="초대 발송">초대 발송</button>
      <button type="button" id="btn-accept" class="secondary" aria-label="수락 시뮬">수락 시뮬</button>
    </div>

    <table>
      <thead>
        <tr>
          <th>이메일</th>
          <th>종류</th>
          <th>상태</th>
          <th>동작</th>
        </tr>
      </thead>
      <tbody id="member-tbody"></tbody>
    </table>
  </div>

  <script>
    const state = {
      linked: false,
      paywall: false,
      groupKey: '',
      capacity: 6,
      members: [
        { email: 'owner-cloud@example.demo', kind: 'ADMIN', status: 'OBSERVED' },
      ],
    };

    function render() {
      document.getElementById('group-key').value = state.groupKey;
      document.getElementById('capacity').value = String(state.capacity);
      const status = document.getElementById('linked-status');
      const paywall = document.getElementById('paywall-alert');
      status.style.display = state.linked ? 'block' : 'none';
      paywall.style.display = state.paywall ? 'block' : 'none';

      const tbody = document.getElementById('member-tbody');
      tbody.innerHTML = '';
      for (const m of state.members) {
        if (m.status === 'REMOVED') continue;
        const tr = document.createElement('tr');
        tr.setAttribute('role', 'row');
        tr.innerHTML =
          '<td role="cell">' + m.email + '</td>' +
          '<td role="cell">' + m.kind + '</td>' +
          '<td role="cell">' + m.status + '</td>' +
          '<td role="cell"><button type="button" class="danger" aria-label="제거" data-email="' + m.email + '">제거</button></td>';
        tbody.appendChild(tr);
      }
      tbody.querySelectorAll('button[aria-label="제거"]').forEach((btn) => {
        btn.addEventListener('click', () => {
          const email = btn.getAttribute('data-email');
          state.members = state.members.filter((x) => x.email !== email);
          render();
        });
      });
    }

    document.getElementById('btn-create').addEventListener('click', () => {
      if (state.paywall) return;
      state.groupKey = state.groupKey || ('mock-' + Date.now());
      state.linked = true;
      render();
    });

    document.getElementById('btn-link').addEventListener('click', () => {
      if (state.paywall) return;
      if (!state.groupKey) state.groupKey = 'mock-linked';
      state.linked = true;
      render();
    });

    document.getElementById('btn-paywall').addEventListener('click', () => {
      state.paywall = true;
      render();
    });

    document.getElementById('btn-clear-paywall').addEventListener('click', () => {
      state.paywall = false;
      render();
    });

    document.getElementById('btn-invite').addEventListener('click', () => {
      if (state.paywall) return;
      const email = document.getElementById('invite-email').value.trim().toLowerCase();
      if (!email) return;
      if (!state.linked) {
        state.groupKey = state.groupKey || ('mock-' + Date.now());
        state.linked = true;
      }
      if (!state.members.some((m) => m.email === email)) {
        state.members.push({ email, kind: 'PENDING_INVITE', status: 'INVITED' });
      }
      render();
    });

    document.getElementById('btn-accept').addEventListener('click', () => {
      const email = document.getElementById('invite-email').value.trim().toLowerCase();
      const m = state.members.find((x) => x.email === email);
      if (m) {
        m.kind = 'MEMBER';
        m.status = 'JOINED';
        render();
      }
    });

    document.getElementById('capacity').addEventListener('change', (e) => {
      state.capacity = parseInt(e.target.value, 10) || 6;
    });

    document.getElementById('group-key').addEventListener('change', (e) => {
      state.groupKey = e.target.value;
    });

    render();
  </script>
</body>
</html>
