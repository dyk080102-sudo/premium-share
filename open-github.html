<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PremiumShare — GitHub 저장소</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --btn: #2563eb;
      --btn-hover: #1d4ed8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      background:
        radial-gradient(circle at top left, #1e3a5f, transparent 45%),
        radial-gradient(circle at bottom right, #0c4a6e, transparent 40%),
        var(--bg);
      color: var(--text);
      padding: 24px;
    }
    .card {
      width: min(520px, 100%);
      background: color-mix(in srgb, var(--card) 92%, white 8%);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 32px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 1.6rem;
    }
    p {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.5;
    }
    a.btn {
      display: inline-block;
      background: var(--btn);
      color: white;
      text-decoration: none;
      font-weight: 700;
      padding: 14px 22px;
      border-radius: 10px;
      transition: background 0.15s ease;
    }
    a.btn:hover { background: var(--btn-hover); }
    .url {
      margin-top: 18px;
      font-size: 0.85rem;
      word-break: break-all;
      color: var(--accent);
    }
    .url a { color: inherit; }
  </style>
</head>
<body>
  <div class="card">
    <h1>PremiumShare</h1>
    <p>GitHub에 올린 전체 프로젝트 저장소를 엽니다.</p>
    <a
      class="btn"
      id="repo-link"
      href="https://github.com/dyk080102-sudo/premium-share"
      target="_blank"
      rel="noopener noreferrer"
    >
      GitHub 저장소 열기
    </a>
    <div class="url">
      <a href="https://github.com/dyk080102-sudo/premium-share" target="_blank" rel="noopener noreferrer">
        https://github.com/dyk080102-sudo/premium-share
      </a>
    </div>
  </div>

  <script>
    // 로컬에서 파일을 열면 바로 저장소로 이동
    const REPO = "https://github.com/dyk080102-sudo/premium-share";
    const params = new URLSearchParams(location.search);
    if (params.get("auto") !== "0") {
      location.href = REPO;
    }
  </script>
</body>
</html>
